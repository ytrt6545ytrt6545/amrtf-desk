<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMRTF Control Desk</title>
  <link rel="stylesheet" href="desk.css">
</head>
<body class="desk-body">
  <!-- 頂部系統狀態列 -->
  <header class="desk-header">
    <div class="header-left">
      <span class="status-badge" id="statusBadge">● READY</span>
      <span class="lesson-badge" id="lessonBadge">--</span>
    </div>
    <div class="header-right">
      <button class="btn-edit-toggle" id="btnEditLayoutToggle" title="切換自訂佈局模式 (Ctrl+E)">🛠️ 編輯佈局</button>
      <button class="header-btn" id="btnMobileStudioToggle" title="1:1 手機佈局模擬編排艙" style="background:#0284c7; color:#fff; font-weight:bold; border-color:#38bdf8;">📱 手機編排</button>
      <button class="header-btn" id="btnQrCode" title="QR">📱</button>
      <button class="header-btn" id="btnMiniToggle" title="MINI">🗕</button>
      <button class="header-btn btn-exit" id="btnExit" title="EXIT">🚪</button>
    </div>
  </header>

  <!-- 頂部抽屜式未上陣倉庫 (Drawer Dock) -->
  <div class="deck-drawer-container" id="deckDrawerContainer">
    <div class="drawer-header">
      <span class="drawer-title">📦 未上陣按鈕倉庫 (點擊標籤召回網格)</span>
      <div class="drawer-actions">
        <button class="drawer-action-btn" id="btnTemplateFull" title="切換為官方全功能排版">全功能模板</button>
        <button class="drawer-action-btn" id="btnTemplateMinimal" title="僅保留 4 顆主控大鍵">研討極簡模板</button>
        <button class="drawer-action-btn" id="btnResetLayout" title="重置為初始配置">↺ 恢復預設</button>
        <button class="drawer-action-btn" id="btnExportLayout" title="匯出佈局為 JSON">📤 匯出</button>
        <label class="drawer-action-btn file-label" for="fileImportLayout" title="從 JSON 匯入佈局">📥 匯入</label>
        <input type="file" id="fileImportLayout" accept=".json" style="display: none;">
      </div>
    </div>
    <div class="drawer-list" id="deckDrawerList"></div>
  </div>

  <!-- 中央區域：LED 碼表與實時手抄稿提詞機 -->
  <main class="desk-main" id="deskMain">
    <div class="time-display-container">
      <div class="led-clock" id="ledClock">00:00 / 00:00</div>
      <div class="speed-indicator" id="speedBadge">1.0x</div>
    </div>

    <div class="prompter-card" id="prompterCard">
      <div class="prompter-label">PROMPTER</div>
      <div class="prompter-text" id="prompterText">大慈恩研討手抄稿提詞機就緒，點擊播放即時同步...</div>
    </div>
  </main>

  <!-- 底部 Companion 8 欄磁吸自訂畫布容器 -->
  <footer class="desk-footer deck-grid-container" id="deckGridContainer">
    <!-- 行 1: 播控核心 -->
    <button class="keycap-btn btn-play-pause" id="btnPlayPause">▶</button>
    <button class="keycap-btn btn-stop" id="btnStop">⏹</button>

    <!-- 行 2: 精細秒數跳轉與倍速 -->
    <button class="keycap-btn" id="btnRewind10">⏪ 10s</button>
    <button class="keycap-btn" id="btnRewind5">⏪ 5s</button>
    <button class="keycap-btn" id="btnForward5">5s ⏩</button>
    <button class="keycap-btn" id="btnForward10">10s ⏩</button>
    <button class="keycap-btn btn-rate" id="btnRate10">1.0x</button>
    <button class="keycap-btn btn-rate" id="btnRate125">1.25x</button>
    <button class="keycap-btn btn-rate" id="btnRate15">1.5x</button>
    <button class="keycap-btn" id="btnFullscreen">🖥️</button>

    <!-- 行 3: 引文循環、講次導航與閱讀模式 -->
    <button class="keycap-btn btn-quote" id="btnSeekQuote">#引文</button>
    <button class="keycap-btn btn-loop" id="btnLoopQuote">🔁 引文</button>
    <button class="keycap-btn btn-loop" id="btnLoopParagraph">🔁 段落</button>
    <button class="keycap-btn" id="btnPrevLesson">◀ 上講</button>
    <button class="keycap-btn" id="btnNextLesson">下講 ▶</button>
    <button class="keycap-btn active-deep" id="btnSpeechMode">🗣️ 播稿</button>
    <button class="keycap-btn active-deep" id="btnScrollMode">📜 持續</button>

    <!-- 行 3.5: 講師精準區段選單模組 Widget -->
    <div class="interval-row" id="intervalRowWidget">
      <div class="interval-field">
        <span class="interval-tag">起</span>
        <select class="interval-select" id="selectIntervalStart" title="播放起點秒數">
          <option value="0">00:00 起點</option>
        </select>
      </div>
      <span class="interval-arrow">➔</span>
      <div class="interval-field">
        <span class="interval-tag">訖</span>
        <select class="interval-select" id="selectIntervalEnd" title="播放終點秒數">
          <option value="0">--:-- 終點</option>
        </select>
      </div>
      <button class="keycap-btn btn-interval" id="btnPlayInterval">▶ 區間</button>
      <button class="keycap-btn btn-interval" id="btnLoopInterval">🔁 區間</button>
      <button class="keycap-btn btn-interval-stop" id="btnStopInterval" style="display: none;">⏹ 停</button>
    </div>

    <!-- 行 4: 前行影片彈窗與畫面視覺控制 -->
    <button class="keycap-btn btn-video" id="btnVideoMigsema">密集嘛</button>
    <button class="keycap-btn btn-video" id="btnVideoPrep">前行</button>
    <button class="keycap-btn btn-video" id="btnVideoDedication">迴向</button>
    <button class="keycap-btn btn-close-video" id="btnCloseVideo">✕ 關片</button>
    <button class="keycap-btn" id="btnThemeToggle">🌓</button>
    <button class="keycap-btn" id="btnFontLarger">🔤+</button>
    <button class="keycap-btn" id="btnFontSmaller">🔤-</button>
  </footer>

  <!-- QR Code 彈窗 Modal -->
  <div class="qr-modal" id="qrModal">
    <div class="qr-card">
      <div class="qr-title">📱 手機無線遙控</div>
      <img id="qrImage" class="qr-img" alt="QR Code" />
      <div class="qr-url" id="qrUrlText">http://...</div>
      <button class="keycap-btn qr-close-btn" id="btnCloseQr">關閉</button>
    </div>
  </div>

  <!-- 永久常駐 DOM 隱形暫存池 (防止隱藏按鈕時 DOM 節點被垃圾回收銷毀) -->
  <div id="deckStashPool" style="display: none !important;"></div>

  <!-- 引入深模組與主控制邏輯 -->
  <script src="modules/deck-storage.js"></script>
  <script src="modules/deck-canvas.js"></script>
  <script src="modules/mobile-reflow-engine.js"></script>
  <script src="modules/mobile-studio-drawer.js"></script>
  <script src="desk.js"></script>
</body>
</html>
